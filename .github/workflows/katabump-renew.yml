name: katabump-renew

on:
  workflow_dispatch:
  schedule:
    # cron 只认 UTC。每天两次，间隔 12 小时:
    # 续期窗口是按小时开放的，只跑 04:00 那一次的话，窗口在白天打开就得
    # 干等到次日 04:00 才续得上；16:00 这次是兜底。
    - cron: "0 20 * * *"  # 北京 04:00（次日）
    - cron: "0 8 * * *"   # 北京 16:00

permissions:
  contents: read
  actions: write

concurrency:
  group: katabump-renew
  cancel-in-progress: false

jobs:
  renew:
    name: Renew accounts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      USERS_JSON: ${{ secrets.USERS_JSON }}
      SUB_URL: ${{ secrets.SUB_URL }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      IS_PROXY: ${{ vars.IS_PROXY || 'false' }}
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true
          install-dependencies: true

      - name: Show runtime info
        run: |
          python --version
          google-chrome --version || true
          chromedriver --version || true

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests pyyaml

      - name: Run unit tests
        # -b: 缓冲测试内部的 stdout，只在失败时打印。
        # 否则 mock 出来的假日志（比如「❌ Turnstile 处理失败」）会混进
        # CI 日志，跟真实运行的输出难以区分。
        run: python -m unittest discover -s tests -v -b

      - name: Prepare output directories
        run: |
          mkdir -p output/screenshots

      # 复用上次跑成功时存下的会话 cookie: 命中就直接跳过 Turnstile，
      # 那是整个流程最不稳的一环（能否通过基本取决于出口 IP 的口碑）。
      # 缓存 key 每次运行都不同 + restore-keys 前缀匹配，是因为缓存条目
      # 不可覆盖，只能「每次写新的、读最近的」。
      #
      # cookie 是会话凭据。本仓库是 private，缓存只对本仓库的 workflow
      # 可见，且没有任何 pull_request 触发器，所以外部 PR 读不到它。
      # 一旦仓库转为 public，这一步要重新评估。
      - name: Restore cookies
        uses: actions/cache/restore@v4
        with:
          path: cookies
          key: katabump-cookies-${{ github.run_id }}
          restore-keys: |
            katabump-cookies-

      # -u 不能省: 步骤的 stdout 是管道（块缓冲），进程一旦被超时/取消
      # 杀掉，最后那几 KB 日志就跟着没了 —— 上次排查卡死时日志正好断在
      # 半句话上，看不出到底停在哪一步。
      - name: Run renew script
        run: |
          xvfb-run -a python -u renew.py

      # 即使脚本失败也要存: 可能只是部分账号失败，成功那些的 cookie 依然有用
      - name: Save cookies
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cookies
          key: katabump-cookies-${{ github.run_id }}

      - name: Upload reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katabump-report-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 1

  cleanup:
    name: Cleanup old runs
    if: always()
    needs: [renew]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WORKFLOW_NAME: katabump-renew
      KEEP_RUNS: "5"

    steps:
      - name: Delete old workflow runs
        shell: bash
        run: |
          set -euo pipefail

          gh run list \
            --repo "$REPO" \
            --workflow "$WORKFLOW_NAME" \
            --limit 100 \
            --json databaseId,createdAt,status,conclusion \
            --jq 'sort_by(.createdAt) | reverse | .[].databaseId' > runs.txt

          total=$(wc -l < runs.txt | tr -d ' ')
          echo "Total runs: $total"
          echo "Keep runs: $KEEP_RUNS"

          if [ "$total" -le "$KEEP_RUNS" ]; then
            echo "No old runs to delete."
            exit 0
          fi

          tail -n +$((KEEP_RUNS + 1)) runs.txt | while read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "Deleting run: $run_id"
            gh run delete "$run_id" --repo "$REPO" || true
            sleep 1
          done
